services:
  mock-server:
    build: .
    ports:
      - "4010:4010"
    environment:
      - HTTP_PORT=4010
      - MANIFEST_DIR=/app/manifests
      - AI_PROTOCOL_TAG=d61b70137ef1f7b736a8945a9105f7e766b24906
      - MANIFEST_SYNC_URL=https://raw.githubusercontent.com/ailib-official/ai-protocol/d61b70137ef1f7b736a8945a9105f7e766b24906/
      - RESPONSE_DELAY=0
      - ERROR_RATE=0
    volumes:
      - ./manifests:/app/manifests
